name: Bug
description: Relate um comportamento inesperado
title: "<Seu Título>"
labels: ["Bug", "status: Aguardando revisão"]
body:
  - type: markdown
    attributes:
      value: "Preencha o máximo de detalhes possível. NÃO ESQUEÇA DE TROCAR O TÍTULO"
  - type: textarea
    id: descricao
    attributes:
      label: Descrição
      description: Qual o bug observado?
    validations:
      required: true
  - type: textarea
    id: passos
    attributes:
      label: Passos para reproduzir
      placeholder: "1. Acesse a tela de horários\n2.\n3."
  - type: textarea
    id: esperado
    attributes:
      label: Especifique o que era esperado nesta seção
  - type: textarea
    id: atual
    attributes:
      label: Especifique o que de fato aconteceu nesta seção
    validations:
      required: true
  - type: dropdown
    id: componente
    attributes:
      label: Componente
      description: Onde o problema parece estar
      options:
        - Interface (frontend)
        - API (backend)
        - Otimizador de horários
        - Autenticação
        - Não sei
    validations:
      required: true
  - type: dropdown
    id: perfil
    attributes:
      label: Perfil de acesso
      description: Com qual perfil você estava usando o sistema?
      options:
        - Aluno
        - Docente
        - Apoio BCC
        - Não estava autenticado
    validations:
      required: true
  - type: dropdown
    id: browser
    attributes:
      label: Navegador
      options:
        - Google Chrome
        - Microsoft Edge
        - Firefox
        - Opera
        - Safari
        - Outros
    validations:
      required: true
  - type: input
    id: versao
    attributes:
      label: Versão do sistema (commit ou branch)
      placeholder: "ex: main, ou o hash do commit"
    validations:
      required: true
  - type: textarea
    id: contexto
    attributes:
      label: Contexto adicional
      description: Insira qualquer outra informação extra que julgar relevante
