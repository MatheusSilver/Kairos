name: Erro Crítico
description: Relate uma página travada, tela em branco ou erro que impede o uso
title: "<Seu Título>"
labels: ["Erro crítico", "status: Aguardando revisão"]
body:
  - type: markdown
    attributes:
      value: "Se puder, inclua logs do console do navegador ou capturas de tela."
  - type: textarea
    id: descricao
    attributes:
      label: Descrição
    validations:
      required: true
  - type: textarea
    id: passos
    attributes:
      label: Passos para reproduzir
      placeholder: "1.\n2.\n3."
    validations:
      required: true
  - type: textarea
    id: atual
    attributes:
      label: Resultado atual
    validations:
      required: true
  - type: dropdown
    id: frequencia
    attributes:
      label: Frequência
      options:
        - Sempre
        - Às vezes
        - Raro
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs
      render: shell
      description: Cole aqui o erro do console do navegador ou a resposta da API.
  - type: dropdown
    id: componente
    attributes:
      label: Componente
      options:
        - Interface (frontend)
        - API (backend)
        - Otimizador de horários
        - Autenticação
        - Não sei
    validations:
      required: true
  - type: dropdown
    id: browser
    attributes:
      label: Navegador
      options:
        - Google Chrome
        - Microsoft Edge
        - Firefox
        - Opera
        - Safari
        - Outros
    validations:
      required: true
  - type: input
    id: versao
    attributes:
      label: Versão do sistema (commit ou branch)
    validations:
      required: true
  - type: textarea
    id: contexto
    attributes:
      label: Contexto adicional
      description: Insira qualquer outra informação extra que julgar relevante
