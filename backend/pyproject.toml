[project]
name = "app"
version = "0.1.0"
description = ""
requires-python = ">=3.10,<4.0"
dependencies = [
    "fastapi[standard]<1.0.0,>=0.114.2",
    "email-validator<3.0.0.0,>=2.1.0.post1",
    "tenacity>=9.2.1,<10.0.0",
    "pydantic>2.0",
    "emails<2.0.0,>=1.1.2",
    "jinja2<4.0.0,>=3.1.4",
    "alembic<2.0.0,>=1.12.1",
    "psycopg[binary]<4.0.0,>=3.1.13",
    "sqlmodel<1.0.0,>=0.0.39",
    "pydantic-settings<3.0.0,>=2.14.2",
    "sentry-sdk[fastapi]>=2.71.0,<3.0.0",
    "pyjwt<3.0.0,>=2.13.0",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1,<10.0.0",
    "httpx<1.0.0,>=0.25.1",
    "mypy>=2.4.0,<3.0.0",
    "ruff<1.0.0,>=0.2.2",
    "prek>=0.2.24,<1.0.0",
    "coverage<8.0.0,>=7.4.3",
    "pylint>=4.1.3,<5.0.0",
    "bandit<2.0.0,>=1.7.9",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.mypy]
strict = true
exclude = ["venv", ".venv", "alembic"]

[tool.ruff]
target-version = "py310"
exclude = ["alembic"]

[tool.ruff.lint]
select = [
    "E",  # pycodestyle errors
    "W",  # pycodestyle warnings
    "F",  # pyflakes
    "I",  # isort
    "B",  # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
    "ARG001", # unused arguments in functions
    "T201",   # print statements are not allowed
]
ignore = [
    "E501",  # line too long, handled by black
    "B008",  # do not perform function calls in argument defaults
    "W191",  # indentation contains tabs
    "B904",  # Allow raising exceptions without from e, for HTTPException
]

[tool.ruff.lint.pyupgrade]
# Preserve types, even if a file imports `from __future__ import annotations`.
keep-runtime-typing = true

[tool.pylint.main]
ignore-paths = ["^app/alembic/.*$"]

[tool.pylint.format]
max-line-length = 120

[tool.pylint."messages control"]
disable = [
    # Comments are kept minimal on purpose
    "missing-module-docstring",
    "missing-class-docstring",
    "missing-function-docstring",
    # Type inference is unreliable against SQLModel/SQLAlchemy
    "no-member",
    "not-callable",
    # Deliberate: schema fields mirror the Senha Unica payload names
    "invalid-name",
    "too-few-public-methods",
    # Idiomatic in FastAPI path parameters
    "redefined-builtin",
    # Already covered by ruff, or intentionally ignored there
    "line-too-long",
    "raise-missing-from",
    "no-else-return",
    "no-else-raise",
    "logging-fstring-interpolation",
    "duplicate-code",
]

[tool.bandit]
exclude_dirs = ["app/alembic"]

[tool.coverage.run]
source = ["app"]
dynamic_context = "test_function"

[tool.coverage.report]
show_missing = true
sort = "-Cover"

[tool.coverage.html]
show_contexts = true
