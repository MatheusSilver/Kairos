name: Interface
description: Problemas de interface, layout ou fluxo
title: "<Seu Título>"
labels: ["Interface", "status: Aguardando revisão"]
body:
  - type: markdown
    attributes:
      value: "Inclua capturas de tela quando possível. NÃO ESQUEÇA DE TROCAR O TÍTULO"
  - type: input
    id: tela
    attributes:
      label: Tela afetada
      placeholder: "ex: cadastro de disponibilidade, grade de horários, fórum de discussões"
    validations:
      required: true
  - type: textarea
    id: descricao
    attributes:
      label: Descreva o problema na interface
    validations:
      required: true
  - type: textarea
    id: capturas
    attributes:
      label: Capturas de tela
      description: "Cole links ou arraste imagens relevantes."
  - type: dropdown
    id: tipo
    attributes:
      label: Tipo de problema
      options:
        - Elemento desalinhado ou sobreposto
        - Texto cortado ou ilegível
        - Cor ou contraste inadequado
        - Fluxo de navegação confuso
        - Problema em tela pequena (responsividade)
        - Acessibilidade
        - Outro
    validations:
      required: true
  - type: dropdown
    id: browser
    attributes:
      label: Navegador
      options:
        - Google Chrome
        - Microsoft Edge
        - Firefox
        - Opera
        - Safari
        - Outros
    validations:
      required: true
  - type: input
    id: versao
    attributes:
      label: Versão do sistema (commit ou branch)
    validations:
      required: true
  - type: textarea
    id: contexto
    attributes:
      label: Contexto adicional
      description: Insira qualquer outra informação extra que julgar relevante
